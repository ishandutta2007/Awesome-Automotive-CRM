<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }

    /* Ambient Pulsing Animations for Dynamic Background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }

    .ambient-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 260px;
    }
    .card-anim-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .card-anim-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashStream 4s linear infinite;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Background Glow Elements (Behind Content) -->
  <g>
    <circle class="ambient-orb-1" cx="220" cy="110" r="140" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
    <circle class="ambient-orb-2" cx="980" cy="250" r="150" fill="#818cf8" opacity="0.3" filter="url(#glow)" />
    <circle cx="600" cy="180" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Animated Data Highway Streams -->
  <g fill="none" opacity="0.45">
    <path class="stream-line" d="M -50 90 Q 300 130 600 80 T 1250 110" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M -50 270 Q 350 230 700 290 T 1250 250" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Subtle Floating Metric Cards in Lower Background -->
  <g class="card-anim-1" opacity="0.85">
    <g transform="translate(80, 275)">
      <rect width="210" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#38bdf8" />
      <text x="42" y="26" fill="#e2e8f0" class="badge-text">⚡ Lead Management &amp; BDC</text>
    </g>
    <g transform="translate(910, 45)">
      <rect width="210" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#818cf8" />
      <text x="42" y="26" fill="#e2e8f0" class="badge-text">🏎️ Desking &amp; F&amp;I Workflows</text>
    </g>
  </g>

  <g class="card-anim-2" opacity="0.85">
    <g transform="translate(80, 45)">
      <rect width="190" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#c084fc" />
      <text x="42" y="26" fill="#e2e8f0" class="badge-text">🛠️ Fixed Ops &amp; Workshop</text>
    </g>
    <g transform="translate(900, 275)">
      <rect width="220" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="24" cy="21" r="7" fill="#34d399" />
      <text x="42" y="26" fill="#e2e8f0" class="badge-text">🔓 Open-Source Dealership DMS</text>
    </g>
  </g>

  <!-- FOREGROUND: High Contrast Center Title & Subtitle (Always Visible & Prominent) -->
  <!-- Header Category Pill -->
  <g transform="translate(485, 52)">
    <rect width="230" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="115" y="21" fill="#38bdf8" text-anchor="middle" class="badge-text" letter-spacing="1">AUTOMOTIVE CRM &amp; DMS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text" fill="#ffffff" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.8))">
    Awesome Automotive CRM
  </text>

  <!-- Gradient Brand Underline -->
  <rect x="420" y="165" width="360" height="4" rx="2" fill="url(#primary-grad)" />

  <!-- Subtitle -->
  <text x="600" y="208" text-anchor="middle" class="subtitle-text" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    Curated Commercial Dealer CRM Suites &amp; Open-Source DMS Platforms
  </text>

  <!-- Key Capability Tags in Foreground -->
  <g transform="translate(305, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="30" rx="15" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    <text x="67" y="19" fill="#e2e8f0" text-anchor="middle" class="badge-text">🚗 Dealer CRM</text>

    <!-- Pill 2 -->
    <rect x="150" y="0" width="135" height="30" rx="15" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    <text x="217" y="19" fill="#e2e8f0" text-anchor="middle" class="badge-text">🏢 DMS Systems</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="145" height="30" rx="15" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    <text x="372" y="19" fill="#e2e8f0" text-anchor="middle" class="badge-text">📈 Equity Mining</text>

    <!-- Pill 4 -->
    <rect x="460" y="0" width="135" height="30" rx="15" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    <text x="527" y="19" fill="#e2e8f0" text-anchor="middle" class="badge-text">🔧 Fixed Ops</text>
  </g>

  <!-- Border Frame -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
</svg>
